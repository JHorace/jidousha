<!doctype html>
<!--
  The playtest page a Jidousha web build ships in (web-publish.md §2).

  Staged by `tools/build-web`, which substitutes __EXAMPLE__ and
  __BUILD_STAMP__; served by `tools/serve-web` locally and by the deploy
  target remotely. Self-contained on purpose: no CDN, no framework — a canvas,
  a module import, and the three things a remote playtester needs (a loading
  state, a panic they can copy, a stamp that names the build).

  The engine appends its own canvas to the body (winit's `with_append`), so
  there is no canvas element here to get out of step with the one winit makes.

  Diagnostic seam: `?frametime=1` turns on the frame-pacing overlay
  (web-publish.md §2). It is page-side only — it reads `performance.now()` and
  `requestAnimationFrame` and never calls into the wasm module, so nothing it
  measures can reach the simulation. Every deployed build has it, which is what
  makes "open it with ?frametime=1 and screenshot the overlay" a bug report a
  playtester on an unknown browser can actually file.

  Presentation seam: `?renderscale=0.5` renders at half the device resolution
  and lets the browser upscale (web-publish.md §2). Opt-in, presentation-only —
  world space, the letterbox and where a click lands are all unchanged, and the
  page simply asks for fewer pixels. It is what a playtester on a browser with a
  slow presentation path can do about it without setting an environment
  variable, and the overlay's slow-presentation warning names it. The parameter
  is read on the *engine* side (jidousha-platform's web/render_scale.rs) rather
  than here, because the canvas's backing store is written by wgpu from the size
  the surface is configured with; the overlay reports what the page ended up
  with, which is the honest half of it to keep on this side.

  Reserved seam (deferred, do not build yet): the "download recording" button
  lands here once the input recording buffer is reachable from the page
  (input §5, web-publish.md §2) — remote playtesting becomes remote
  deterministic repro. It will sit beside the copy button in #panic-overlay
  and in the footer.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__EXAMPLE__ — jidousha</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #101014;
        color: #c8c8d0;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      /* The canvas winit appends. Filling the body is what makes a resize a
         real resize, which is the thing worth checking on this target. */
      canvas {
        flex: 1 1 auto;
        display: block;
        width: 100%;
        min-height: 0;
      }
      #loading {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }
      #loading .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #2a2a33;
        border-top-color: #c8c8d0;
        border-radius: 50%;
        animation: jidousha-spin 0.9s linear infinite;
      }
      @keyframes jidousha-spin {
        to {
          transform: rotate(360deg);
        }
      }
      #status {
        padding: 6px 10px;
        border-top: 1px solid #2a2a33;
        white-space: pre-wrap;
      }
      #status.failed {
        color: #ff8080;
      }
      #stamp {
        padding: 2px 10px 6px;
        color: #6a6a75;
      }
      /* The panic overlay (web-publish.md §2 CONTRACT): a wasm panic renders
         the full §9 message on the page, with a copy button. Remote
         playtesters do not open devtools — "screenshot or copy the red box"
         is the bug report. */
      #panic-overlay {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: rgba(16, 16, 20, 0.92);
        z-index: 10;
      }
      #panic-overlay.shown {
        display: flex;
      }
      #panic-box {
        max-width: min(720px, 100%);
        max-height: 80%;
        overflow: auto;
        border: 1px solid #a03030;
        border-radius: 6px;
        background: #1c1014;
        padding: 16px;
      }
      #panic-box h1 {
        margin: 0 0 8px;
        font-size: 14px;
        color: #ff8080;
      }
      #panic-text {
        margin: 0 0 12px;
        white-space: pre-wrap;
        color: #f0d0d0;
      }
      #panic-copy {
        font: inherit;
        color: #c8c8d0;
        background: #2a2a33;
        border: 1px solid #3a3a45;
        border-radius: 4px;
        padding: 4px 12px;
        cursor: pointer;
      }
      #panic-copy:hover {
        background: #34343f;
      }
      /* The frame-pacing overlay (?frametime=1, web-publish.md §2). Below the
         panic overlay's z-index on purpose: a panic is the more important
         thing to read. */
      #frametime {
        position: fixed;
        top: 8px;
        right: 8px;
        display: none;
        z-index: 9;
        /* Wide enough that the readings below do not wrap: a wrapped line costs
           a row of a panel that must fit without scrolling, and the panel takes
           no pointer events so nobody can scroll it. */
        max-width: min(440px, calc(100% - 16px));
        /* A last resort rather than the plan: the readings are kept short enough
           to fit, because a panel that takes no pointer events cannot be
           scrolled by the person reading it. */
        max-height: calc(100% - 16px);
        overflow: auto;
        padding: 8px 10px;
        border: 1px solid #2a2a33;
        border-radius: 6px;
        background: rgba(16, 16, 20, 0.9);
        color: #c8c8d0;
        font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        /* `pre-wrap`, not `pre`: the histogram's rows are short enough never to
           wrap at this width, and the one line that is not — the renderer
           string, which is the line a bug report is *for* — wraps instead of
           disappearing off the right edge. */
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        /* Never in the way of the game underneath: this is an instrument, not
           a control. */
        pointer-events: none;
      }
      #frametime.shown {
        display: block;
      }
      #frametime h2 {
        margin: 0 0 4px;
        font-size: 11px;
        color: #8ad0ff;
      }
      #frametime-warning {
        display: none;
        margin: 4px 0 0;
        padding: 4px 6px;
        border: 1px solid #a06030;
        border-radius: 4px;
        background: #241a10;
        color: #ffc080;
        white-space: pre-wrap;
      }
      #frametime-warning.shown {
        display: block;
      }
      #frametime-note {
        margin: 4px 0 0;
        color: #6a6a75;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
      <div>loading __EXAMPLE__…</div>
    </div>
    <div id="panic-overlay">
      <div id="panic-box">
        <h1>__EXAMPLE__ panicked</h1>
        <pre id="panic-text"></pre>
        <button id="panic-copy">copy the message</button>
      </div>
    </div>
    <div id="frametime">
      <h2>frame pacing — __EXAMPLE__</h2>
      <div id="frametime-body">measuring…</div>
      <div id="frametime-warning"></div>
      <div id="frametime-note"></div>
    </div>
    <div id="status">starting __EXAMPLE__…</div>
    <div id="stamp">build __BUILD_STAMP__</div>
    <script type="module">
      // The status line exists so a failure is visible on the page rather than
      // only in devtools — the same reason the engine's errors say what to do
      // rather than only what happened.
      const status = document.getElementById("status");
      const loading = document.getElementById("loading");
      const say = (text, failed = false) => {
        status.textContent = text;
        status.classList.toggle("failed", failed);
      };
      const doneLoading = () => loading.remove();

      // A playtester's bug report always identifies its build (web-publish.md
      // §1): visible in the footer, and logged so a copied console goes with it.
      console.log("jidousha build __BUILD_STAMP__ — __EXAMPLE__");

      // The panic overlay. The engine's wasm panic hook writes the full §9
      // message to console.error behind this marker (its first line); the page
      // renders everything after the marker as the red box. Marker and hook
      // live in jidousha-platform's web/panic.rs — one contract, two halves.
      const PANIC_MARKER = "[jidousha panic]\n";
      let panicked = false;
      const overlay = document.getElementById("panic-overlay");
      const panicText = document.getElementById("panic-text");
      const copyButton = document.getElementById("panic-copy");
      const showPanic = (text) => {
        panicked = true;
        panicText.textContent = text;
        overlay.classList.add("shown");
        doneLoading();
        say(text.split("\n")[0], true);
        // The marker --check greps for: "the panic overlay rendered".
        document.body.dataset.jidousha = "panicked";
      };
      copyButton.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(panicText.textContent);
          copyButton.textContent = "copied";
        } catch {
          // No clipboard permission (an embedded browser, an old one): select
          // the text instead, so a manual copy is one keystroke.
          const range = document.createRange();
          range.selectNodeContents(panicText);
          const selection = getSelection();
          selection.removeAllRanges();
          selection.addRange(range);
          copyButton.textContent = "press Ctrl/Cmd-C to copy";
        }
      });

      // A wasm panic aborts, and the message goes to the console. Mirroring it
      // onto the page means a person looking at the window sees it too.
      //
      // The engine's own §9 reports arrive the same way — a missing asset, a
      // frame it had to skip — and those are *handled* problems: the game is
      // still running, with a placeholder where the art should be. They are
      // worth showing and are not worth calling a failure, so the `[jidousha] `
      // prefix tells them apart. A real panic arrives behind PANIC_MARKER and
      // becomes the overlay.
      const consoleError = console.error.bind(console);
      console.error = (...args) => {
        consoleError(...args);
        const text = args.map(String).join(" ");
        if (text.startsWith(PANIC_MARKER)) {
          showPanic(text.slice(PANIC_MARKER.length));
          return;
        }
        say(text, !text.startsWith("[jidousha] "));
      };
      // The abort that follows a panic also surfaces as a RuntimeError through
      // these listeners; the overlay is already up by then, so they only speak
      // when something failed *without* going through the panic hook.
      window.addEventListener("error", (event) => {
        if (!panicked) say(String(event.message), true);
      });
      window.addEventListener("unhandledrejection", (event) => {
        if (!panicked) say(String(event.reason), true);
      });

      // --- the frame-pacing overlay (?frametime=1, web-publish.md §2) -------
      //
      // What it is for: "the ball jumps forward in this browser and glides in
      // that one" is a report nobody can act on, and the facts that settle it —
      // how evenly frames arrive, how far off the display's own cadence that
      // is, and whether this browser admits to rendering in software — are all
      // readable from the page. So the page reads them, on any deployed build,
      // from a query parameter alone.
      //
      // One of those facts turned out to be a lie, which is why there are now
      // three: the renderer string is spoofable and Firefox spoofs it
      // (frame-pacing.md §5). The measured ones are the ones to trust.
      //
      // CONTRACT: this is presentation-side and stays that way. It reads
      // `performance.now()` and `requestAnimationFrame` and never calls into
      // the wasm module; the engine's own clock is `jidousha-platform`'s and
      // real time reaches the simulation through one door (ADR-0005, core.md
      // §7). Nothing measured here can move a tick.
      const frametimeRequested = () => {
        const value = new URLSearchParams(location.search).get("frametime");
        return value !== null && value !== "0" && value !== "false";
      };

      // The engine's numbers, mirrored here so the model below is the loop the
      // game is actually running (core.md §7). A copy, and knowingly: the page
      // cannot import a Rust constant, so this is the one place two numbers
      // have to agree by hand.
      const TICK_HZ = 60; // GameConfig::fixed_dt's default, 1/60
      const MAX_FRAME_S = 0.25; // Simulation's spiral-of-death ceiling

      // How coarse this browser's clock is, read off the frame deltas.
      //
      // Hypothesis 2. Firefox clamps `performance.now()` to about a millisecond
      // by default; a 1ms quantum against a 16.67ms cadence drifts, and the
      // accumulator answers a drifting delta with an occasional 0-tick or
      // 2-tick frame — a visible stutter with no dropped frame behind it.
      // Chrome's quantum is ~5µs and does not do this.
      //
      // DELIBERATE: read from the deltas already collected, rather than by
      // busy-looping on `performance.now()` until it moves. Two reasons, and
      // the first alone settles it:
      //
      //  1. **An instrument for frame pacing must not spend a frame measuring
      //     itself.** A loop that runs until the clock ticks burns real
      //     milliseconds inside a rAF callback — on exactly the slow browsers
      //     this overlay exists to diagnose, that is a frame it *caused* to be
      //     late, reported as a frame that was late.
      //  2. **A loop on the clock cannot bound itself with that same clock.** A
      //     headless browser driven with `--virtual-time-budget` does not
      //     advance `performance.now()` during synchronous execution, so a
      //     wall-clock escape hatch never fires and only the iteration ceiling
      //     stops it. `tools/serve-web --check` drives exactly such a browser.
      //
      // What is left is a better measurement anyway: a quantised clock can only
      // report whole milliseconds, so every frame delta it produces is a whole
      // number of them, while a fine clock scatters. That is read from the
      // page's real frame cadence rather than from a microbenchmark of the
      // clock, and it costs nothing.

      /// Frame deltas below this far from a whole millisecond count as whole.
      ///
      /// Float noise only: a 1ms-quantised clock lands on integers exactly, and
      /// a fine one misses by hundredths at the very least.
      const WHOLE_MS_EPSILON = 0.02;

      /// How many deltas before the verdict is worth printing.
      const CLOCK_SAMPLE = 30;

      // Whether this browser is presenting slowly — measured, not read off a
      // string.
      //
      // The finding that forced this (frame-pacing.md §5): the renderer string
      // is *spoofable*. Firefox's anti-fingerprinting bucket reports "NVIDIA
      // GeForce GTX 980, or similar" on a machine whose GPU is an RTX 5090, so
      // the software warning below can be quietly wrong on precisely the
      // browser this overlay was built to diagnose. What could not lie was the
      // cadence: the same page presented at ~12 Hz in Firefox and ~238 Hz in
      // Chrome, on the same display, on the same machine. So the warning a
      // playtester can trust is the one derived from the frames themselves.
      //
      // It needs a reference the median cannot poison, and the "display ~N Hz"
      // reading was not one: it is estimated *from* the median, so on the
      // defective browser it read 12 Hz on a 240 Hz display and had nothing left
      // to be surprised by. The tenth-percentile delta is that reference — a
      // browser presenting at the display's cadence produces its quickest
      // frames at the refresh period — and the tenth percentile rather than the
      // outright minimum so one double-reported rAF cannot define it.

      /// How far above the estimated refresh period a median frame has to sit.
      ///
      /// 2.5×: well past what an ordinary mixed workload does to a healthy
      /// browser (Chrome's reading was 1.02× of its own quickest tenth) and well
      /// under the defect (Firefox's was 5.2×).
      const SLOW_RATIO = 2.5;

      /// …and how slow it has to be in absolute terms, whatever the ratio says.
      ///
      /// 2.5× of a 240Hz period is still 96fps, which nobody needs a warning
      /// about. A frame slower than a thirtieth of a second is choppy on any
      /// display and no display refreshes slower than that, so this floor is
      /// what stops the ratio firing on a browser that is merely fast.
      const SLOW_FLOOR_MS = 1000 / 30;

      /// How many frames before the verdict is worth printing.
      ///
      /// One second at 60Hz and five at the 12Hz this exists to catch, which is
      /// the right way round: a slow page has to *stay* slow before the panel
      /// says so, and a page that is slow for five seconds is not having a
      /// moment.
      const SLOW_SAMPLE = 60;

      // Which renderer this browser hands WebGL, and whether it is a CPU.
      //
      // Hypothesis 1 in one string. Firefox on Linux falls back to software
      // WebRender and software WebGL more readily than Chrome does, and a frame
      // that misses its deadline makes the accumulator run two ticks to catch
      // up — the "jumps forward" signature. `WEBGL_debug_renderer_info` is the
      // only way to ask, it is absent under `privacy.resistFingerprinting`, and
      // an absent answer is reported as absent rather than guessed at.
      const SOFTWARE_RENDERERS =
        /llvmpipe|lavapipe|swiftshader|softpipe|swrast|software|mesa offscreen|basic render/i;
      const probeRenderer = () => {
        let gl = null;
        try {
          const probe = document.createElement("canvas");
          probe.width = 1;
          probe.height = 1;
          gl = probe.getContext("webgl2") || probe.getContext("webgl");
          if (!gl) return { name: null, why: "this browser gave no WebGL context" };
          const info = gl.getExtension("WEBGL_debug_renderer_info");
          const name = String(
            (info && gl.getParameter(info.UNMASKED_RENDERER_WEBGL)) ||
              gl.getParameter(gl.RENDERER) ||
              "",
          );
          return name
            ? { name, why: null }
            : { name: null, why: "the renderer string is hidden (privacy settings)" };
        } catch (error) {
          return { name: null, why: String(error) };
        } finally {
          // A probe context that stays alive is a context the game cannot have
          // on a browser with a small limit.
          try {
            const lose = gl && gl.getExtension("WEBGL_lose_context");
            if (lose) lose.loseContext();
          } catch {
            // Losing the probe is a courtesy, not a requirement.
          }
        }
      };

      const startFrametimeOverlay = () => {
        const panel = document.getElementById("frametime");
        const body = document.getElementById("frametime-body");
        const warning = document.getElementById("frametime-warning");
        const note = document.getElementById("frametime-note");
        panel.classList.add("shown");

        const renderer = probeRenderer();
        const software = renderer.name !== null && SOFTWARE_RENDERERS.test(renderer.name);
        const verdict = renderer.name === null ? "unknown" : software ? "software" : "hardware";
        // The marker `tools/serve-web --check` reads, and the one line of this
        // overlay a bug report has to contain.
        document.body.dataset.jidoushaFrametime = verdict;

        // Both warnings share one box, and the box says everything that is
        // wrong rather than the first thing that is: a browser can be
        // software-rendering *and* presenting slowly, and on the browser that
        // prompted the second warning the first one is unreliable — the
        // renderer string it reads is spoofed (frame-pacing.md §5).
        const showWarnings = (pace) => {
          const messages = [];
          if (software) {
            messages.push(
              "this browser is software-rendering; expect jank\n" +
                "a frame the CPU misses makes the engine run two ticks at once — " +
                "which is what a ball jumping forward looks like",
            );
          }
          if (pace.verdict === "slow") {
            messages.push(
              "this browser is presenting slowly; motion will be choppy\n" +
                "median frame " +
                pace.median.toFixed(2) +
                "ms against a " +
                pace.quick.toFixed(2) +
                "ms refresh period (" +
                pace.ratio.toFixed(1) +
                "x) — no pacing logic makes a page this slow look smooth\n" +
                "add &renderscale=0.5 to this URL: a quarter of the device " +
                "pixels, and nothing about the game changes",
            );
          }
          warning.textContent = messages.join("\n\n");
          warning.classList.toggle("shown", messages.length > 0);
        };
        // From the first instruction, so a page dumped before any frame has
        // been measured still carries whatever is already known.
        document.body.dataset.jidoushaPresentation = "sampling";
        showWarnings({ verdict: "sampling" });

        // Kept short: the panel must fit without scrolling, because it takes no
        // pointer events and so cannot be scrolled.
        note.textContent =
          "ticks/frame is modelled, not read from the engine: this page runs the " +
          "same accumulator (" +
          TICK_HZ +
          " Hz, " +
          MAX_FRAME_S +
          "s ceiling) over these deltas.\n" +
          "?renderscale=0.5 draws a quarter of the pixels (presentation only).\n" +
          "Firefox: about:support → Graphics → Compositing + GPU #1/#2.";

        // A rolling window, so the panel describes the last few seconds rather
        // than averaging away the thing being looked for.
        const WINDOW = 240;
        const deltas = [];
        let accumulator = 0;
        const ticksPerFrame = [0, 0, 0, 0]; // 0, 1, 2, 3-or-more
        let frames = 0;
        let previous = null;
        let painted = 0;

        // The clock's grain, over the same rolling window the histogram reads.
        const clockGrain = () => {
          if (deltas.length < CLOCK_SAMPLE) return "sampling…";
          const off = (ms) => Math.abs(ms - Math.round(ms));
          const worst = deltas.reduce((peak, ms) => Math.max(peak, off(ms)), 0);
          return worst < WHOLE_MS_EPSILON
            ? "whole milliseconds — coarse (~1ms), drifts against a 16.67ms cadence"
            : "sub-millisecond — fine";
        };

        /// The delta `fraction` of the way up a sorted window.
        const percentile = (sorted, fraction) =>
          sorted.length === 0
            ? 0
            : sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * fraction))];

        /// How this browser is presenting, against the refresh period its own
        /// quickest frames imply. See SLOW_RATIO above for why it is measured
        /// this way rather than read off the renderer string.
        const presentation = (sorted) => {
          const quick = percentile(sorted, 0.1);
          const median = percentile(sorted, 0.5);
          if (sorted.length < SLOW_SAMPLE || quick <= 0) {
            return { verdict: "sampling", quick, median, ratio: 0 };
          }
          const ratio = median / quick;
          return {
            verdict: ratio >= SLOW_RATIO && median > SLOW_FLOOR_MS ? "slow" : "ok",
            quick,
            median,
            ratio,
          };
        };

        // What the page actually got, rather than what its URL asked for.
        //
        // `?renderscale=` is read by the engine (jidousha-platform's
        // web/render_scale.rs), not here: wgpu writes canvas.width from the size
        // the surface is configured with, so a page-side write would be
        // overwritten by the next configure. The page therefore reports the
        // *effect* — the backing store against the device-pixel box it is
        // displayed in — which is also the reading that answers "did the
        // parameter do anything" without anybody having to trust the URL.
        const backingStore = () => {
          const canvas = document.querySelector("canvas");
          if (!canvas || !canvas.width || !canvas.clientWidth) {
            return "no canvas yet";
          }
          const ratio = window.devicePixelRatio || 1;
          const box = {
            width: Math.round(canvas.clientWidth * ratio),
            height: Math.round(canvas.clientHeight * ratio),
          };
          const scale = box.width > 0 ? canvas.width / box.width : 1;
          return (
            scale.toFixed(2) +
            "x — " +
            canvas.width +
            "x" +
            canvas.height +
            " of " +
            box.width +
            "x" +
            box.height +
            " device px"
          );
        };

        const histogram = () => {
          // One-millisecond buckets to 25ms, then coarse. A millisecond is the
          // resolution that separates 8.33 from 16.67 and shows a quantised
          // clock's deltas piling onto whole numbers.
          const buckets = new Map();
          const label = (ms) => {
            if (ms >= 50) return "50ms+";
            if (ms >= 34) return "34-50ms";
            if (ms >= 25) return "25-34ms";
            const low = Math.floor(ms);
            return String(low) + "-" + String(low + 1) + "ms";
          };
          const order = (ms) => (ms >= 50 ? 1000 : ms >= 34 ? 999 : ms >= 25 ? 998 : Math.floor(ms));
          for (const ms of deltas) {
            const key = label(ms);
            const seen = buckets.get(key) || { count: 0, order: order(ms) };
            seen.count += 1;
            buckets.set(key, seen);
          }
          const rows = [...buckets.entries()].sort((a, b) => a[1].order - b[1].order);
          const most = rows.reduce((peak, row) => Math.max(peak, row[1].count), 1);
          return rows
            .map(([key, seen]) => {
              const bar = "#".repeat(Math.max(1, Math.round((seen.count / most) * 20)));
              const share = Math.round((seen.count / deltas.length) * 100);
              return (
                "  " +
                key.padStart(8) +
                " " +
                bar.padEnd(20) +
                " " +
                String(seen.count).padStart(4) +
                " (" +
                share +
                "%)"
              );
            })
            .join("\n");
        };

        const render = () => {
          const sorted = [...deltas].sort((a, b) => a - b);
          const median = percentile(sorted, 0.5);
          const mean = sorted.length
            ? deltas.reduce((sum, ms) => sum + ms, 0) / deltas.length
            : 0;
          const presented = median > 0 ? 1000 / median : 0;
          const pace = presentation(sorted);
          // The marker `tools/serve-web --check` reads for the measured
          // verdict, beside the renderer string's.
          document.body.dataset.jidoushaPresentation = pace.verdict;
          showWarnings(pace);
          const share = (count) => Math.round((count / Math.max(1, frames)) * 100);
          // "present", not "display": this is the rate frames reach the screen
          // at, and the whole finding in frame-pacing.md §5 is that the two can
          // be twenty times apart. The line below is the display's own estimate.
          //
          // The static half is written from the first frame on, so a page
          // dumped early says what browser it is rather than "measuring…".
          body.textContent =
            "present   ~" +
            presented.toFixed(1) +
            " Hz — median " +
            median.toFixed(2) +
            "ms, mean " +
            mean.toFixed(2) +
            "ms\n" +
            "refresh   " +
            (pace.verdict === "sampling"
              ? "sampling… (" + deltas.length + " of " + SLOW_SAMPLE + " frames)"
              : "~" +
                (1000 / pace.quick).toFixed(1) +
                " Hz est.; this page " +
                pace.ratio.toFixed(1) +
                "x — slow past " +
                SLOW_RATIO +
                "x") +
            "\n" +
            "scale     " +
            backingStore() +
            "\n" +
            "spread    " +
            (sorted.length ? sorted[0].toFixed(2) : "0.00") +
            "ms .. " +
            (sorted.length ? sorted[sorted.length - 1].toFixed(2) : "0.00") +
            "ms over " +
            deltas.length +
            " frames\n" +
            "renderer  " +
            (renderer.name || "unknown — " + renderer.why) +
            "\n" +
            "webgpu    " +
            ("gpu" in navigator ? "available" : "absent") +
            "\n" +
            "clock     " +
            clockGrain() +
            "\n" +
            "ticks/fr  0:" +
            ticksPerFrame[0] +
            " (" +
            share(ticksPerFrame[0]) +
            "%)  1:" +
            ticksPerFrame[1] +
            " (" +
            share(ticksPerFrame[1]) +
            "%)  2:" +
            ticksPerFrame[2] +
            " (" +
            share(ticksPerFrame[2]) +
            "%)  3+:" +
            ticksPerFrame[3] +
            " (" +
            share(ticksPerFrame[3]) +
            "%)\n" +
            "frame deltas\n" +
            histogram();
        };

        const onFrame = (now) => {
          if (previous !== null) {
            const ms = now - previous;
            deltas.push(ms);
            if (deltas.length > WINDOW) deltas.shift();
            // The engine's accumulator, run on the same deltas: whole ticks come
            // out, the remainder carries, and a frame longer than the ceiling is
            // clamped rather than spent (core.md §7).
            accumulator += Math.min(ms / 1000, MAX_FRAME_S);
            let ticks = 0;
            while (accumulator >= 1 / TICK_HZ) {
              accumulator -= 1 / TICK_HZ;
              ticks += 1;
            }
            ticksPerFrame[Math.min(ticks, 3)] += 1;
            frames += 1;
            // Four repaints a second: the panel is an instrument, and an
            // instrument that costs a frame to draw is measuring itself.
            if (now - painted > 250) {
              painted = now;
              render();
            }
          } else {
            // Something on the panel from the first frame, so a page dumped by
            // a headless browser is never dumped mid-"measuring…".
            render();
            painted = now;
          }
          previous = now;
          requestAnimationFrame(onFrame);
        };
        requestAnimationFrame(onFrame);
        console.log(
          "[jidousha] frame-pacing overlay on; WebGL renderer: " +
            (renderer.name || "unknown") +
            " (" +
            verdict +
            ")",
        );
      };

      if (frametimeRequested()) startFrametimeOverlay();

      try {
        const module = await import("./__EXAMPLE__.js");
        await module.default();
        // Reaching here means the wasm module started. It does not mean a GPU
        // was found — that is asked for asynchronously and reported by the
        // engine itself (renderer.md §10).
        doneLoading();
        say("__EXAMPLE__ running — build __BUILD_STAMP__");
        // A marker for `tools/serve-web --check`, which drives a headless
        // browser and needs to know the difference between "still loading" and
        // "started".
        document.body.dataset.jidousha = "running";
      } catch (error) {
        if (!panicked) {
          doneLoading();
          // Instantiation failing outright has two ordinary causes, and
          // neither is the game's code — name them (web-publish.md §2).
          say(
            "__EXAMPLE__ failed to load: " +
              String(error) +
              "\nlikely cause: a browser too old for WebAssembly modules; a " +
              "server that does not send .wasm as application/wasm; or — if a " +
              "current browser shows this on every page — a module damaged by " +
              "the build toolchain (an old wasm-opt does exactly that)" +
              "\nfix: try a current browser; if serving this yourself, use " +
              "tools/serve-web, which sets the MIME type correctly; if every " +
              "browser fails, rebuild with tools/build-web and read its " +
              "wasm-opt line",
            true,
          );
          document.body.dataset.jidousha = "failed";
        }
      }
    </script>
  </body>
</html>
