<!doctype html>
<!--
  The engine repo's dist/ root: one link per built page (web-publish.md §3,
  ADR-0038). Generated by `tools/build-web --all` (the full fleet, what PR
  previews deploy) or `--release-fleet` (games + the allowlisted examples, what
  production serves, §3a), which substitutes __SECTIONS__ and __BUILD_STAMP__.
  Every section is substituted whole — heading, blurb and list — so a build with
  no prototypes, or a fleet with no examples, carries no empty heading, and so
  the two fleets can order and name their sections differently without this file
  knowing which one it is. Game repos never use this page: a game published on
  its own sits at its site root with no index above it.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>jidousha — examples and games</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #101014;
        color: #c8c8d0;
        font: 15px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 48px 24px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      h2 {
        font-size: 15px;
        margin: 32px 0 4px;
        color: #8a8a95;
        font-weight: normal;
      }
      p {
        margin: 0 0 24px;
        color: #8a8a95;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      li a {
        display: block;
        padding: 10px 14px;
        margin: 0 0 8px;
        border: 1px solid #2a2a33;
        border-radius: 6px;
        color: #c8c8d0;
        text-decoration: none;
      }
      li a:hover {
        border-color: #4a4a58;
        background: #16161c;
      }
      li.headline a {
        border-color: #4a5a7a;
      }
      footer {
        margin-top: 32px;
        color: #6a6a75;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>jidousha</h1>
__SECTIONS__
      <footer>build __BUILD_STAMP__ · add ?panic=1 to any page to test its bug-report overlay</footer>
    </main>
  </body>
</html>
