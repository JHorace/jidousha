# CI gates, one job per signal (implementation-plan §1.3). Every job is required
# from the first commit: a gate added later is a gate that finds nothing.
#
# The toolchain is not installed by an action — rustup honors rust-toolchain.toml
# on the first cargo invocation, so CI and a developer machine run the identical
# pinned toolchain, components and targets (agent-practices §6.5).
#
# The tools/ scripts are invoked as `python tools/<name>`: `setup-python`
# guarantees `python` on every runner OS, while the shebang path (`tools/test`)
# is Unix-only.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check

  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The golden-image tier (renderer.md §9) needs an adapter, and a runner
      # has no GPU. lavapipe is Mesa's software rasterizer: it renders on the
      # CPU, deterministically, which is what makes a checked-in reference
      # reproducible here at all. Without it the golden tests say so and pass,
      # so this is what turns a skipped tier into a running one — not a
      # workaround for a failure.
      - name: install a software rasterizer (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - name: tools/test
        run: python tools/test
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}
          path: target/verify/report.json
          if-no-files-found: warn
      # The captured frame from `tools/verify prototype_kit`, and anything a
      # failing golden test left behind. Downloadable, so "what did it actually
      # draw?" is answerable from a CI run rather than only on a machine.
      - name: Upload rendered frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frames-${{ matrix.os }}
          path: |
            target/verify/*.png
            target/verify/golden/*.png
          if-no-files-found: ignore

  wasm:
    name: check wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `rustup target add` step: rust-toolchain.toml pins the target (ADR-0005).
      - run: cargo check --workspace --target wasm32-unknown-unknown
      # M4's exit criterion: the examples must build for the web too. They are
      # *run* on Linux and Windows (tools/test); running them under wasm needs a
      # runtime, which arrives with the platform milestone.
      - run: cargo check --workspace --examples --target wasm32-unknown-unknown

  doctor:
    name: doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # A healthy runner must produce ENV_OK. If doctor cries wolf here, it will
      # be ignored when it matters (agent-practices §6.1).
      - run: python tools/doctor

  assets:
    name: asset references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # A mistyped asset path is a CI failure, not a placeholder hunt at
      # runtime (assets.md §2, §7). Its own job as well as a tools/test phase:
      # it needs no toolchain, so it answers in seconds on a runner that is
      # still compiling.
      - run: python tools/check-assets

  games:
    name: game dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # A prototype reaches the engine through the `jidousha` facade and nothing
      # else (ADR-0038). Its own job as well as a `tools/test` phase, from the
      # same script either way: a check enforced in one place and skippable in
      # the other is a check whose result depends on where you stood.
      - run: python tools/check-game-deps

  api:
    name: public API surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Every public item is shown in an example, no example reaches past the
      # facade, and docs/api/ is what the facade generates — stale documentation
      # is worse than none, because an agent believes it (public-api.md §4).
      - run: python tools/check-api-coverage
      - run: python tools/gen-api-doc --check

  claude-md:
    name: CLAUDE.md size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/check-claude-md

  deps:
    name: dependency count
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Reports only — the dependency budget is enforced by review of the
      # justification each new dependency records in its commit (practices §5.8).
      - run: python tools/dep-count

  web:
    name: web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The wasm-bindgen CLI must equal the crate version Cargo.lock pins
      # (web-publish.md §5). Prebuilt release binary rather than `cargo
      # install` — seconds against minutes for the same program — and the
      # version is read from the lock, so there is nothing here to drift.
      # Same recipe as .claude/hooks/session-start.sh.
      - name: install wasm-bindgen at the version Cargo.lock pins
        run: |
          version="$(awk '/^name = "wasm-bindgen"$/{found=1; next}
                          found && /^version = /{gsub(/[",]/, "", $3); print $3; exit}' Cargo.lock)"
          name="wasm-bindgen-${version}-x86_64-unknown-linux-musl"
          curl -sSfL --retry 3 "https://github.com/rustwasm/wasm-bindgen/releases/download/${version}/${name}.tar.gz" | tar xz
          sudo install -m 755 "${name}/wasm-bindgen" /usr/local/bin/wasm-bindgen
          rm -rf "${name}"
      # Optional for build-web (it skips with a log line), but what deploys
      # should be the smaller module. A pinned release binary, NOT Ubuntu's
      # package: 24.04 ships binaryen 108, which clamps the externref table
      # wasm-bindgen's glue grows from JS — every optimized module then died
      # at startup in every browser (found by playtesting PR #59's preview).
      # build-web also refuses a wasm-opt older than its own pinned minimum,
      # so a runner-image change cannot silently reintroduce this.
      - name: install binaryen (wasm-opt), pinned release
        run: |
          version="version_124"
          curl -sSfL --retry 3 "https://github.com/WebAssembly/binaryen/releases/download/${version}/binaryen-${version}-x86_64-linux.tar.gz" | tar xz
          sudo install -m 755 "binaryen-${version}/bin/wasm-opt" /usr/local/bin/wasm-opt
          rm -rf "binaryen-${version}"
      # CONTRACT (web-publish.md §1): tools/build-web is the ONLY web build
      # path — no inline build steps here. What CI deploys is what a developer
      # built locally with the same command.
      #
      # Which fleet, though, is this workflow's decision and only this one
      # (web-publish.md §3a, owner 2026-08-23): a `main` push builds the
      # release fleet, because production is the curated face; a PR builds the
      # full fleet, because a preview is where an engine change gets eyeballed
      # and where device bugs turn up (the binaryen defect was caught on one).
      # This step picks a fleet by name and never names a fleet's members — the
      # example allowlist is data in tools/build-web, in exactly one place, and
      # games are enumerated from the `games/*` glob in both fleets (ADR-0038).
      - name: build the web fleet (release on main, full on PRs)
        run: python tools/build-web ${{ github.event_name == 'push' && '--release-fleet' || '--all' }}
      # Run the optimized bytes in a real browser before they can deploy — the
      # exact check that would have caught the binaryen-108 table damage. The
      # ?panic=1 and ?frametime=1 passes check the two overlay contracts too
      # (web-publish.md §2) — and the second of those can *require* a
      # software-rendering verdict, because a runner has no GPU.
      #
      # EVERY page of whatever fleet was built, not just its first. This step
      # used to check `head -n 1 dist/fleet.txt`, and because the two fleets
      # lead with different pages, the page production serves was never checked
      # before a merge: a PR led with prototype_kit, `main` led with pong, and a
      # failure in pong could only appear after it had already landed. It did
      # (jidousha#79 through #82, 2026-08-30/09-01, two days of red `main`).
      # The workflow still names no page and no fleet — `serve-web --check`
      # reads dist/fleet.txt, so this covers whichever fleet the step above
      # chose, and keeps covering it when a fleet's membership changes.
      #
      # timeout-minutes because the failure mode this replaces was a *hang*: one
      # page hanging costs the check's own 120s ceiling, and the loop deliberately
      # does not stop at the first failure (one broken page and a wholly broken
      # build need different responses, and only finishing tells them apart).
      # This bounds the pathological case where every page hangs.
      #
      # JIDOUSHA_CHROMIUM points at the runner's google-chrome: the `chromium`
      # on its PATH is a snap shim that hangs headless (observed: 120s, no DOM),
      # and the tool's env override exists for exactly this.
      - name: browser-check every page of the built fleet
        timeout-minutes: 25
        run: JIDOUSHA_CHROMIUM="$(command -v google-chrome)" python tools/serve-web --check
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          if-no-files-found: error
      # The browser's own evidence, kept only when something went wrong. A
      # separate step rather than `if: always()` on the one above, so the
      # deploy's artifact keeps its contract exactly (`web-dist`, and a missing
      # dist/ is still an error) and this cannot add a second red to a run that
      # already failed earlier — `warn`, because a build that died before the
      # browser ran leaves nothing here to collect.
      #
      # Why it exists: three consecutive 120s browser hangs produced no
      # diagnosis, because the log the check writes lives outside dist/ and
      # nothing collected it (BLOCKED.md, 2026-09-01).
      - name: keep the browser's log when the check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-check-logs
          # The logs and the screenshots, not the browser profiles beside them:
          # the whole directory is 126MB and 1170 files of Chrome profile
          # (measured, jidousha#81), and one of those entries is a socket the
          # uploader cannot pack. What diagnoses a hang is six small files.
          path: |
            target/web-check/*/*.log
            target/web-check/*/*.png
          if-no-files-found: warn

  deploy:
    name: deploy web (production on main, preview on PRs)
    # Only after every gate in this same run has passed (web-publish.md §4).
    needs: [fmt, clippy, test, wasm, doctor, assets, games, api, claude-md, deps, web]
    # Fork PRs receive no secrets and get no preview: this job then skips —
    # a neutral notice, not a failure and not worked around (ADR-0037).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the sticky preview comment
    steps:
      - uses: actions/checkout@v4 # for wrangler.toml
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # `main` → the production URL (web-publish.md §3-§4). node + wrangler are
      # CI-only dependencies: they live here, never in the local toolchain.
      - name: deploy production
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 deploy
      # PR → a preview version aliased pr-<number>, so the URL is stable across
      # pushes while the content tracks the branch head.
      - name: upload preview version
        if: github.event_name == 'pull_request'
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          alias="pr-${{ github.event.number }}"
          upload() { npx wrangler@4 versions upload --preview-alias "${alias}" 2>&1 | tee upload.log; }
          if ! upload; then
            # Previews are versions of the production Worker, so the very
            # first preview in a fresh account has nothing to attach to —
            # wrangler refuses with "does not yet exist". Bootstrap the Worker
            # by deploying once (production serves nothing until the first
            # main push, which replaces this), then retry the aliased upload.
            # Only this one error is caught; anything else stays a failure.
            if grep -q "does not yet exist" upload.log; then
              echo "the Worker does not exist yet — bootstrapping it with this build"
              npx wrangler@4 deploy
              upload
            else
              echo "versions upload failed — read the log above" >&2
              exit 1
            fi
          fi
          # Prefer the stable alias URL; fall back to the per-version preview URL.
          url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' upload.log | grep "^https://${alias}-" | tail -1 || true)"
          if [ -z "${url}" ]; then
            url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' upload.log | tail -1 || true)"
          fi
          if [ -z "${url}" ]; then
            echo "the upload printed no preview URL — read upload.log above" >&2
            exit 1
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "stamp=$(cat dist/stamp.txt)" >> "$GITHUB_OUTPUT"
      # One sticky comment per PR, updated in place on every push — never a
      # new comment per push (web-publish.md §4).
      - name: sticky preview comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- jidousha-web-preview -->";
            const url = ${{ toJSON(steps.preview.outputs.url) }};
            const stamp = ${{ toJSON(steps.preview.outputs.stamp) }};
            const body = [
              marker,
              `**Web preview**: ${url}`,
              "",
              `The full fleet — every example and game — playable at build \`${stamp}\`.`,
              "Production serves the release fleet instead: the games plus the worked example (web-publish.md §3a).",
              "Add `?panic=1` to any page URL to see its bug-report overlay, or `?frametime=1` for the frame-pacing readout (web-publish.md §2).",
              "",
              "_Updated in place on each push._",
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
